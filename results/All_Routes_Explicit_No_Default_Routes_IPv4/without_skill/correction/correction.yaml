          10.255.34.0/30 via 10.255.13.2 dev eth2
          10.255.45.0/30 via 10.255.12.2 dev eth1
      - command: ip -4 route show table main | grep -Ev ' proto kernel scope link( |$)|^(default|0[.]0[.]0[.]0/0)' | sort
        output: |-
          10.2.2.0/24 via 10.255.12.2 dev eth1
          10.3.3.0/24 via 10.255.13.2 dev eth2
