      - command: "sh -c '! ip route show default | grep -q .'"
        exit_code: 0
    r2:
      - command: "sh -c '! ip route show default | grep -q .'"
        exit_code: 0
    r3:
      - command: "sh -c '! ip route show default | grep -q .'"
