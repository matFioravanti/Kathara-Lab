    pc4b: [192.168.1.11, 192.168.1.12, 192.168.2.11, 192.168.2.12, 192.168.3.11, 192.168.3.12, 192.168.4.11, 192.168.5.11, 192.168.5.12]
    pc5a: [192.168.1.11, 192.168.1.12, 192.168.2.11, 192.168.2.12, 192.168.3.11, 192.168.3.12, 192.168.4.11, 192.168.4.12, 192.168.5.12]
    pc5b: [192.168.1.11, 192.168.1.12, 192.168.2.11, 192.168.2.12, 192.168.3.11, 192.168.3.12, 192.168.4.11, 192.168.4.12, 192.168.5.11]

  custom_commands:
