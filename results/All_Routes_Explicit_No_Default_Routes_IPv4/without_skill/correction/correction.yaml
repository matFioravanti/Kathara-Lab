lab_inline: |
  r1[0]="lan1"
  r1[1]="r1r2"
  r1[2]="r1r3"
  r2[0]="lan2"
  r2[1]="r1r2"
  r2[2]="r2r4"
  r3[0]="lan3"
  r3[1]="r1r3"
  r3[2]="r3r4"
  r4[0]="lan4"
  r4[1]="r2r4"
  r4[2]="r3r4"
  r4[3]="r4r5"
  r5[0]="lan5"
  r5[1]="r4r5"

  pc1a[0]="lan1"
  pc1b[0]="lan1"
  pc2a[0]="lan2"
  pc2b[0]="lan2"
  pc3a[0]="lan3"
  pc3b[0]="lan3"
  pc4a[0]="lan4"
  pc4b[0]="lan4"
  pc5a[0]="lan5"
  pc5b[0]="lan5"

convergence_time: 10
default_image: kathara/core

test:
  requiring_startup:
    - pc1a
    - pc1b
    - pc2a
    - pc2b
    - pc3a
    - pc3b
    - pc4a
    - pc4b
    - pc5a
    - pc5b

  ip_mapping:
    r1:
      "0": 10.1.1.1/24
      "1": 10.255.12.1/30
      "2": 10.255.13.1/30
    r2:
      "0": 10.2.2.1/24
      "1": 10.255.12.2/30
      "2": 10.255.24.1/30
    r3:
      "0": 10.3.3.1/24
      "1": 10.255.13.2/30
      "2": 10.255.34.1/30
    r4:
      "0": 10.4.4.1/24
      "1": 10.255.24.2/30
      "2": 10.255.34.2/30
      "3": 10.255.45.1/30
    r5:
      "0": 10.5.5.1/24
      "1": 10.255.45.2/30
    pc1a: { "0": 10.1.1.10/24 }
    pc1b: { "0": 10.1.1.11/24 }
    pc2a: { "0": 10.2.2.10/24 }
    pc2b: { "0": 10.2.2.11/24 }
    pc3a: { "0": 10.3.3.10/24 }
    pc3b: { "0": 10.3.3.11/24 }
    pc4a: { "0": 10.4.4.10/24 }
    pc4b: { "0": 10.4.4.11/24 }
    pc5a: { "0": 10.5.5.10/24 }
    pc5b: { "0": 10.5.5.11/24 }

  kernel_routes:
    r1:
      - [10.2.2.0/24, [10.255.12.2, eth1]]
      - [10.3.3.0/24, [10.255.13.2, eth2]]
      - [10.4.4.0/24, [10.255.12.2, eth1]]
      - [10.5.5.0/24, [10.255.12.2, eth1]]
      - [10.255.24.0/30, [10.255.12.2, eth1]]
      - [10.255.34.0/30, [10.255.13.2, eth2]]
      - [10.255.45.0/30, [10.255.12.2, eth1]]
    r2:
