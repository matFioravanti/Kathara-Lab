  custom_commands:
    r1:
      - command: ip -6 addr show scope global
        output: ""
      - command: ip -4 route show table main proto boot | sort
        output: |-
          10.2.2.0/24 via 10.255.12.2 dev eth1
          10.3.3.0/24 via 10.255.13.2 dev eth2
          10.4.4.0/24 via 10.255.12.2 dev eth1
          10.5.5.0/24 via 10.255.12.2 dev eth1
