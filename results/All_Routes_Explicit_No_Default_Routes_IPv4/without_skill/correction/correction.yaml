      - [10.5.5.0/24, [10.255.34.2, eth2]]
      - [10.255.12.0/30, [10.255.13.1, eth1]]
      - [10.255.24.0/30, [10.255.34.2, eth2]]
      - [10.255.45.0/30, [10.255.34.2, eth2]]
    r4:
