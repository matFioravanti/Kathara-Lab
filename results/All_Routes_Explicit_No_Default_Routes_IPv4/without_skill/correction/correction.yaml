    pc5a:
      - [0.0.0.0/0, [192.168.5.1]]
    pc5b:
      - [0.0.0.0/0, [192.168.5.1]]

  reachability:
    pc1a: [192.168.1.12, 192.168.2.11, 192.168.2.12, 192.168.3.11, 192.168.3.12, 192.168.4.11, 192.168.4.12, 192.168.5.11, 192.168.5.12]
    pc1b: [192.168.1.11, 192.168.2.11, 192.168.2.12, 192.168.3.11, 192.168.3.12, 192.168.4.11, 192.168.4.12, 192.168.5.11, 192.168.5.12]
    pc2a: [192.168.1.11, 192.168.1.12, 192.168.2.12, 192.168.3.11, 192.168.3.12, 192.168.4.11, 192.168.4.12, 192.168.5.11, 192.168.5.12]
    pc2b: [192.168.1.11, 192.168.1.12, 192.168.2.11, 192.168.3.11, 192.168.3.12, 192.168.4.11, 192.168.4.12, 192.168.5.11, 192.168.5.12]
    pc3a: [192.168.1.11, 192.168.1.12, 192.168.2.11, 192.168.2.12, 192.168.3.12, 192.168.4.11, 192.168.4.12, 192.168.5.11, 192.168.5.12]
    pc3b: [192.168.1.11, 192.168.1.12, 192.168.2.11, 192.168.2.12, 192.168.3.11, 192.168.4.11, 192.168.4.12, 192.168.5.11, 192.168.5.12]
