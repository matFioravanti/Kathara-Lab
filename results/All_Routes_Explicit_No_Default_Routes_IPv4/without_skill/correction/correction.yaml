      - [10.3.3.0/24, [10.255.12.1, eth1]]
      - [10.4.4.0/24, [10.255.24.2, eth2]]
      - [10.5.5.0/24, [10.255.24.2, eth2]]
      - [10.255.13.0/30, [10.255.12.1, eth1]]
      - [10.255.34.0/30, [10.255.24.2, eth2]]
      - [10.255.45.0/30, [10.255.24.2, eth2]]
    r3:
      - [10.1.1.0/24, [10.255.13.1, eth1]]
      - [10.2.2.0/24, [10.255.13.1, eth1]]
