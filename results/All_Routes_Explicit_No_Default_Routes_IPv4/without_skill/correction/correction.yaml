lab_inline: |
  r1[0]="r1-r2"
  r1[1]="r1-r3"
  r1[2]="lan1"
  r2[0]="r1-r2"
  r2[1]="r2-r4"
  r2[2]="lan2"
  r3[0]="r1-r3"
  r3[1]="r3-r4"
  r3[2]="lan3"
  r4[0]="r2-r4"
  r4[1]="r3-r4"
  r4[2]="r4-r5"
  r4[3]="lan4"
  r5[0]="r4-r5"
  r5[1]="lan5"
  pc1a[0]="lan1"
  pc1b[0]="lan1"
  pc2a[0]="lan2"
  pc2b[0]="lan2"
  pc3a[0]="lan3"
  pc3b[0]="lan3"
  pc4a[0]="lan4"
  pc4b[0]="lan4"
  pc5a[0]="lan5"
  pc5b[0]="lan5"

convergence_time: 10
default_image: kathara/core

test:
  requiring_startup:
    - r1
    - r2
    - r3
    - r4
    - r5
    - pc1a
    - pc1b
    - pc2a
    - pc2b
    - pc3a
    - pc3b
    - pc4a
    - pc4b
    - pc5a
    - pc5b

  ip_mapping:
    r1:
      "0": 10.0.12.1/30
      "1": 10.0.13.1/30
      "2": 192.168.1.1/24
    r2:
      "0": 10.0.12.2/30
      "1": 10.0.24.1/30
      "2": 192.168.2.1/24
    r3:
      "0": 10.0.13.2/30
      "1": 10.0.34.1/30
      "2": 192.168.3.1/24
    r4:
      "0": 10.0.24.2/30
      "1": 10.0.34.2/30
      "2": 10.0.45.1/30
      "3": 192.168.4.1/24
    r5:
      "0": 10.0.45.2/30
      "1": 192.168.5.1/24
    pc1a:
      "0": 192.168.1.11/24
    pc1b:
      "0": 192.168.1.12/24
    pc2a:
      "0": 192.168.2.11/24
    pc2b:
      "0": 192.168.2.12/24
    pc3a:
      "0": 192.168.3.11/24
    pc3b:
      "0": 192.168.3.12/24
    pc4a:
      "0": 192.168.4.11/24
    pc4b:
      "0": 192.168.4.12/24
    pc5a:
      "0": 192.168.5.11/24
    pc5b:
      "0": 192.168.5.12/24

  kernel_routes:
    r1:
      - [192.168.2.0/24, [10.0.12.2]]
      - [192.168.3.0/24, [10.0.13.2]]
      - [192.168.4.0/24, [10.0.12.2]]
      - [192.168.5.0/24, [10.0.12.2]]
      - [10.0.24.0/30, [10.0.12.2]]
      - [10.0.34.0/30, [10.0.13.2]]
      - [10.0.45.0/30, [10.0.12.2]]
    r2:
      - [192.168.1.0/24, [10.0.12.1]]
      - [192.168.3.0/24, [10.0.12.1]]
      - [192.168.4.0/24, [10.0.24.2]]
      - [192.168.5.0/24, [10.0.24.2]]
      - [10.0.13.0/30, [10.0.12.1]]
      - [10.0.34.0/30, [10.0.24.2]]
      - [10.0.45.0/30, [10.0.24.2]]
    r3:
      - [192.168.1.0/24, [10.0.13.1]]
      - [192.168.2.0/24, [10.0.13.1]]
      - [192.168.4.0/24, [10.0.34.2]]
      - [192.168.5.0/24, [10.0.34.2]]
      - [10.0.12.0/30, [10.0.13.1]]
      - [10.0.24.0/30, [10.0.34.2]]
      - [10.0.45.0/30, [10.0.34.2]]
    r4:
      - [192.168.1.0/24, [10.0.24.1]]
      - [192.168.2.0/24, [10.0.24.1]]
      - [192.168.3.0/24, [10.0.34.1]]
      - [192.168.5.0/24, [10.0.45.2]]
      - [10.0.12.0/30, [10.0.24.1]]
      - [10.0.13.0/30, [10.0.34.1]]
    r5:
      - [192.168.1.0/24, [10.0.45.1]]
      - [192.168.2.0/24, [10.0.45.1]]
      - [192.168.3.0/24, [10.0.45.1]]
      - [192.168.4.0/24, [10.0.45.1]]
      - [10.0.12.0/30, [10.0.45.1]]
      - [10.0.13.0/30, [10.0.45.1]]
      - [10.0.24.0/30, [10.0.45.1]]
      - [10.0.34.0/30, [10.0.45.1]]
    pc1a:
      - [0.0.0.0/0, [192.168.1.1]]
    pc1b:
      - [0.0.0.0/0, [192.168.1.1]]
    pc2a:
      - [0.0.0.0/0, [192.168.2.1]]
    pc2b:
      - [0.0.0.0/0, [192.168.2.1]]
    pc3a:
      - [0.0.0.0/0, [192.168.3.1]]
    pc3b:
