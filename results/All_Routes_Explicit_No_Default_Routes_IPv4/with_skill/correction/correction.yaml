        exit_code: 0
      - command: ip -4 route show exact 10.1.2.0/24
        regex_match: "\\bproto static\\b"
      - command: ip -4 route show exact 10.1.3.0/24
        regex_match: "\\bproto static\\b"
      - command: ip -4 route show exact 10.1.4.0/24
        regex_match: "\\bproto static\\b"
