lab_inline: |
  r1[0]="lan1"
  r1[1]="r1_r2"
  r1[2]="r1_r3"
  r2[0]="lan2"
  r2[1]="r1_r2"
  r2[2]="r2_r4"
  r3[0]="lan3"
  r3[1]="r1_r3"
  r3[2]="r3_r4"
  r4[0]="lan4"
  r4[1]="r2_r4"
  r4[2]="r3_r4"
  r4[3]="r4_r5"
  r5[0]="lan5"
  r5[1]="r4_r5"
  pc1a[0]="lan1"
  pc1b[0]="lan1"
  pc2a[0]="lan2"
  pc2b[0]="lan2"
  pc3a[0]="lan3"
  pc3b[0]="lan3"
  pc4a[0]="lan4"
  pc4b[0]="lan4"
  pc5a[0]="lan5"
  pc5b[0]="lan5"

convergence_time: 10
default_image: kathara/core

test:
  requiring_startup:
    - r1
    - r2
    - r3
    - r4
    - r5
    - pc1a
    - pc1b
    - pc2a
    - pc2b
    - pc3a
    - pc3b
    - pc4a
    - pc4b
    - pc5a
    - pc5b

  ip_mapping:
    r1:
      "0": 10.1.1.1/24
      "1": 172.16.12.1/30
      "2": 172.16.13.1/30
    r2:
      "0": 10.2.2.1/24
      "1": 172.16.12.2/30
      "2": 172.16.24.1/30
    r3:
      "0": 10.3.3.1/24
      "1": 172.16.13.2/30
      "2": 172.16.34.1/30
    r4:
      "0": 10.4.4.1/24
      "1": 172.16.24.2/30
      "2": 172.16.34.2/30
      "3": 172.16.45.1/30
    r5:
      "0": 10.5.5.1/24
      "1": 172.16.45.2/30
    pc1a: {"0": 10.1.1.11/24}
    pc1b: {"0": 10.1.1.12/24}
    pc2a: {"0": 10.2.2.11/24}
    pc2b: {"0": 10.2.2.12/24}
    pc3a: {"0": 10.3.3.11/24}
    pc3b: {"0": 10.3.3.12/24}
    pc4a: {"0": 10.4.4.11/24}
    pc4b: {"0": 10.4.4.12/24}
    pc5a: {"0": 10.5.5.11/24}
    pc5b: {"0": 10.5.5.12/24}

  kernel_routes:
    r1:
      - [10.2.2.0/24, [172.16.12.2, eth1]]
      - [10.3.3.0/24, [172.16.13.2, eth2]]
      - [10.4.4.0/24, [172.16.12.2, eth1]]
      - [10.5.5.0/24, [172.16.12.2, eth1]]
      - [172.16.24.0/30, [172.16.12.2, eth1]]
      - [172.16.34.0/30, [172.16.13.2, eth2]]
      - [172.16.45.0/30, [172.16.12.2, eth1]]
    r2:
      - [10.1.1.0/24, [172.16.12.1, eth1]]
      - [10.3.3.0/24, [172.16.12.1, eth1]]
      - [10.4.4.0/24, [172.16.24.2, eth2]]
      - [10.5.5.0/24, [172.16.24.2, eth2]]
      - [172.16.13.0/30, [172.16.12.1, eth1]]
      - [172.16.34.0/30, [172.16.24.2, eth2]]
      - [172.16.45.0/30, [172.16.24.2, eth2]]
    r3:
      - [10.1.1.0/24, [172.16.13.1, eth1]]
      - [10.2.2.0/24, [172.16.13.1, eth1]]
      - [10.4.4.0/24, [172.16.34.2, eth2]]
      - [10.5.5.0/24, [172.16.34.2, eth2]]
      - [172.16.12.0/30, [172.16.13.1, eth1]]
      - [172.16.24.0/30, [172.16.34.2, eth2]]
      - [172.16.45.0/30, [172.16.34.2, eth2]]
    r4:
      - [10.1.1.0/24, [172.16.24.1, eth1]]
      - [10.2.2.0/24, [172.16.24.1, eth1]]
      - [10.3.3.0/24, [172.16.34.1, eth2]]
      - [10.5.5.0/24, [172.16.45.2, eth3]]
      - [172.16.12.0/30, [172.16.24.1, eth1]]
      - [172.16.13.0/30, [172.16.34.1, eth2]]
    r5:
      - [10.1.1.0/24, [172.16.45.1, eth1]]
      - [10.2.2.0/24, [172.16.45.1, eth1]]
      - [10.3.3.0/24, [172.16.45.1, eth1]]
      - [10.4.4.0/24, [172.16.45.1, eth1]]
      - [172.16.12.0/30, [172.16.45.1, eth1]]
      - [172.16.13.0/30, [172.16.45.1, eth1]]
      - [172.16.24.0/30, [172.16.45.1, eth1]]
      - [172.16.34.0/30, [172.16.45.1, eth1]]
    pc1a: [[0.0.0.0/0, [10.1.1.1, eth0]]]
    pc1b: [[0.0.0.0/0, [10.1.1.1, eth0]]]
    pc2a: [[0.0.0.0/0, [10.2.2.1, eth0]]]
    pc2b: [[0.0.0.0/0, [10.2.2.1, eth0]]]
    pc3a: [[0.0.0.0/0, [10.3.3.1, eth0]]]
    pc3b: [[0.0.0.0/0, [10.3.3.1, eth0]]]
    pc4a: [[0.0.0.0/0, [10.4.4.1, eth0]]]
    pc4b: [[0.0.0.0/0, [10.4.4.1, eth0]]]
    pc5a: [[0.0.0.0/0, [10.5.5.1, eth0]]]
    pc5b: [[0.0.0.0/0, [10.5.5.1, eth0]]]

  reachability:
    pc1a: [10.1.1.12, 10.2.2.11, 10.2.2.12, 10.3.3.11, 10.3.3.12, 10.4.4.11, 10.4.4.12, 10.5.5.11, 10.5.5.12]
    pc1b: [10.1.1.11, 10.2.2.11, 10.2.2.12, 10.3.3.11, 10.3.3.12, 10.4.4.11, 10.4.4.12, 10.5.5.11, 10.5.5.12]
    pc2a: [10.1.1.11, 10.1.1.12, 10.2.2.12, 10.3.3.11, 10.3.3.12, 10.4.4.11, 10.4.4.12, 10.5.5.11, 10.5.5.12]
    pc2b: [10.1.1.11, 10.1.1.12, 10.2.2.11, 10.3.3.11, 10.3.3.12, 10.4.4.11, 10.4.4.12, 10.5.5.11, 10.5.5.12]
    pc3a: [10.1.1.11, 10.1.1.12, 10.2.2.11, 10.2.2.12, 10.3.3.12, 10.4.4.11, 10.4.4.12, 10.5.5.11, 10.5.5.12]
    pc3b: [10.1.1.11, 10.1.1.12, 10.2.2.11, 10.2.2.12, 10.3.3.11, 10.4.4.11, 10.4.4.12, 10.5.5.11, 10.5.5.12]
    pc4a: [10.1.1.11, 10.1.1.12, 10.2.2.11, 10.2.2.12, 10.3.3.11, 10.3.3.12, 10.4.4.12, 10.5.5.11, 10.5.5.12]
    pc4b: [10.1.1.11, 10.1.1.12, 10.2.2.11, 10.2.2.12, 10.3.3.11, 10.3.3.12, 10.4.4.11, 10.5.5.11, 10.5.5.12]
    pc5a: [10.1.1.11, 10.1.1.12, 10.2.2.11, 10.2.2.12, 10.3.3.11, 10.3.3.12, 10.4.4.11, 10.4.4.12, 10.5.5.12]
    pc5b: [10.1.1.11, 10.1.1.12, 10.2.2.11, 10.2.2.12, 10.3.3.11, 10.3.3.12, 10.4.4.11, 10.4.4.12, 10.5.5.11]

  custom_commands:
    r1:
      - command: sysctl net.ipv4.ip_forward
        regex_match: "net\\.ipv4\\.ip_forward = 1"
      - command: "ip route show default | grep -q .; test $? -eq 1"
        exit_code: 0
    r2:
      - command: sysctl net.ipv4.ip_forward
        regex_match: "net\\.ipv4\\.ip_forward = 1"
      - command: "ip route show default | grep -q .; test $? -eq 1"
        exit_code: 0
    r3:
      - command: sysctl net.ipv4.ip_forward
        regex_match: "net\\.ipv4\\.ip_forward = 1"
      - command: "ip route show default | grep -q .; test $? -eq 1"
        exit_code: 0
    r4:
      - command: sysctl net.ipv4.ip_forward
        regex_match: "net\\.ipv4\\.ip_forward = 1"
      - command: "ip route show default | grep -q .; test $? -eq 1"
        exit_code: 0
    r5:
      - command: sysctl net.ipv4.ip_forward
        regex_match: "net\\.ipv4\\.ip_forward = 1"
      - command: "ip route show default | grep -q .; test $? -eq 1"
        exit_code: 0
