lab_inline: |
  r1[0]="lan_client"
  r1[1]="link_r1_r2"
  r2[0]="link_r1_r2"
  r2[1]="link_r2_r3"
  r3[0]="link_r2_r3"
  r3[1]="lan_orgdns"
  r3[2]="link_r3_r4"
  r4[0]="link_r3_r4"
  r4[1]="lan_web"
  r4[2]="link_r4_r5"
  r5[0]="link_r4_r5"
  r5[1]="lan_rootdns"
  client[0]="lan_client"
  localdns[0]="lan_client"
  orgdns[0]="lan_orgdns"
  rootdns[0]="lan_rootdns"
  web[0]="lan_web"

convergence_time: 10
default_image: kathara/core

test:
  kernel_routes:
    r1:
      - ["10.10.23.0/30", ["10.10.12.2", "eth1"]]
      - ["10.10.3.0/24", ["10.10.12.2", "eth1"]]
      - ["10.10.34.0/30", ["10.10.12.2", "eth1"]]
      - ["10.10.4.0/24", ["10.10.12.2", "eth1"]]
      - ["10.10.45.0/30", ["10.10.12.2", "eth1"]]
      - ["10.10.5.0/24", ["10.10.12.2", "eth1"]]
    r2:
      - ["10.10.1.0/24", ["10.10.12.1", "eth0"]]
      - ["10.10.3.0/24", ["10.10.23.3", "eth1"]]
      - ["10.10.34.0/30", ["10.10.23.3", "eth1"]]
      - ["10.10.4.0/24", ["10.10.23.3", "eth1"]]
      - ["10.10.45.0/30", ["10.10.23.3", "eth1"]]
      - ["10.10.5.0/24", ["10.10.23.3", "eth1"]]
    r3:
      - ["10.10.1.0/24", ["10.10.23.2", "eth0"]]
      - ["10.10.12.0/30", ["10.10.23.2", "eth0"]]
      - ["10.10.4.0/24", ["10.10.34.4", "eth2"]]
      - ["10.10.45.0/30", ["10.10.34.4", "eth2"]]
      - ["10.10.5.0/24", ["10.10.34.4", "eth2"]]
    r4:
      - ["10.10.1.0/24", ["10.10.34.3", "eth0"]]
      - ["10.10.12.0/30", ["10.10.34.3", "eth0"]]
      - ["10.10.23.0/30", ["10.10.34.3", "eth0"]]
      - ["10.10.3.0/24", ["10.10.34.3", "eth0"]]
      - ["10.10.5.0/24", ["10.10.45.5", "eth2"]]
    r5:
      - ["10.10.1.0/24", ["10.10.45.4", "eth0"]]
      - ["10.10.12.0/30", ["10.10.45.4", "eth0"]]
      - ["10.10.23.0/30", ["10.10.45.4", "eth0"]]
      - ["10.10.3.0/24", ["10.10.45.4", "eth0"]]
      - ["10.10.34.0/30", ["10.10.45.4", "eth0"]]
      - ["10.10.4.0/24", ["10.10.45.4", "eth0"]]
    client:
      - ["0.0.0.0/0", ["10.10.1.1", "eth0"]]
    localdns:
      - ["0.0.0.0/0", ["10.10.1.1", "eth0"]]
    orgdns:
      - ["0.0.0.0/0", ["10.10.3.1", "eth0"]]
    rootdns:
      - ["0.0.0.0/0", ["10.10.5.1", "eth0"]]
    web:
      - ["0.0.0.0/0", ["10.10.4.1", "eth0"]]

  applications:
    dns:
      authoritative:
        ".":
          - 10.10.5.53
        org:
          - 10.10.3.53
      local_ns:
        10.10.1.53:
          - client
      records:
        A:
          kathara.org:
            - 10.10.4.80

  reachability:
    client:
      - kathara.org

  custom_commands:
    r1:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r2:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r3:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r4:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r5:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
