LAB_DESCRIPTION="Five routers with static routing, hierarchical DNS, and kathara.org web service"
LAB_VERSION="1.0"

# Five-router transit path.  Each router has at most three directly attached networks.
r1[0]="lan_client"
r1[1]="link_r1_r2"
r1[2]="lan_localdns"
r1[image]="kathara/core:latest"

r2[0]="link_r1_r2"
r2[1]="link_r2_r3"
r2[image]="kathara/core:latest"

r3[0]="link_r2_r3"
r3[1]="link_r3_r4"
r3[2]="lan_rootdns"
r3[image]="kathara/core:latest"

r4[0]="link_r3_r4"
r4[1]="link_r4_r5"
r4[2]="lan_orgdns"
r4[image]="kathara/core:latest"

r5[0]="link_r4_r5"
r5[1]="lan_web"
r5[image]="kathara/core:latest"

client[0]="lan_client"
client[image]="kathara/core:latest"

localdns[0]="lan_localdns"
localdns[image]="kathara/bind:latest"

rootdns[0]="lan_rootdns"
rootdns[image]="kathara/bind:latest"

orgdns[0]="lan_orgdns"
orgdns[image]="kathara/bind:latest"

web[0]="lan_web"
web[image]="kathara/apache:latest"
