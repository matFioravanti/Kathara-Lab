# Five-router static-routing topology with a three-level DNS hierarchy.
# Router-to-router graph: r1 -- r2 -- r3 -- r4 -- r5 (maximum degree: 2).

r1[0]="client_net"
r1[1]="lns_net"
r1[2]="r1_r2"

r2[0]="r1_r2"
r2[1]="r2_r3"

r3[0]="r2_r3"
r3[1]="root_net"
r3[2]="r3_r4"

r4[0]="r3_r4"
r4[1]="org_net"
r4[2]="r4_r5"

r5[0]="r4_r5"
r5[1]="web_net"

client[0]="client_net"
lns[0]="lns_net"
rootdns[0]="root_net"
orgdns[0]="org_net"
web[0]="web_net"

rootdns[image]="kathara/bind9"
orgdns[image]="kathara/bind9"
lns[image]="kathara/bind9"
