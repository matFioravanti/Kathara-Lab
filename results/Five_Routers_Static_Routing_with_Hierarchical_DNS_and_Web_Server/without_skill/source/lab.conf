# Five routers, static routing, and a hierarchical DNS service.
# Router R3 is the only branching router and has degree 3.
r1[0]="clientnet"
r1[1]="r1r2"
r2[0]="r1r2"
r2[1]="r2r3"
r3[0]="r2r3"
r3[1]="r3r4"
r3[2]="r3r5"
r4[0]="r3r4"
r4[1]="rootdnsnet"
r5[0]="r3r5"
r5[1]="servernet"

client[0]="clientnet"
localdns[0]="clientnet"
rootdns[0]="rootdnsnet"
orgdns[0]="rootdnsnet"
web[0]="servernet"

