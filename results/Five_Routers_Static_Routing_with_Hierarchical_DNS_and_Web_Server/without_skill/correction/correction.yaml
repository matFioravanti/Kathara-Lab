lab_inline: |
  r1[0]="clientnet"
  r1[1]="r1r2"
  r2[0]="r1r2"
  r2[1]="r2r3"
  r3[0]="r2r3"
  r3[1]="r3r4"
  r3[2]="r3r5"
  r4[0]="r3r4"
  r4[1]="rootdnsnet"
  r5[0]="r3r5"
  r5[1]="servernet"
  client[0]="clientnet"
  localdns[0]="clientnet"
  rootdns[0]="rootdnsnet"
  orgdns[0]="rootdnsnet"
  web[0]="servernet"

convergence_time: 10
default_image: kathara/core

test:
  kernel_routes:
    r1:
      - ["10.0.23.0/30", ["10.0.12.2", "eth1"]]
      - ["10.0.34.0/30", ["10.0.12.2", "eth1"]]
      - ["10.0.35.0/30", ["10.0.12.2", "eth1"]]
      - ["10.0.4.0/24", ["10.0.12.2", "eth1"]]
      - ["10.0.5.0/24", ["10.0.12.2", "eth1"]]
    r2:
      - ["10.0.1.0/24", ["10.0.12.1", "eth0"]]
      - ["10.0.34.0/30", ["10.0.23.2", "eth1"]]
      - ["10.0.35.0/30", ["10.0.23.2", "eth1"]]
      - ["10.0.4.0/24", ["10.0.23.2", "eth1"]]
      - ["10.0.5.0/24", ["10.0.23.2", "eth1"]]
    r3:
      - ["10.0.1.0/24", ["10.0.23.1", "eth0"]]
      - ["10.0.12.0/30", ["10.0.23.1", "eth0"]]
      - ["10.0.4.0/24", ["10.0.34.2", "eth1"]]
      - ["10.0.5.0/24", ["10.0.35.2", "eth2"]]
    r4:
      - ["10.0.1.0/24", ["10.0.34.1", "eth0"]]
      - ["10.0.12.0/30", ["10.0.34.1", "eth0"]]
      - ["10.0.23.0/30", ["10.0.34.1", "eth0"]]
      - ["10.0.35.0/30", ["10.0.34.1", "eth0"]]
      - ["10.0.5.0/24", ["10.0.34.1", "eth0"]]
    r5:
      - ["10.0.1.0/24", ["10.0.35.1", "eth0"]]
      - ["10.0.12.0/30", ["10.0.35.1", "eth0"]]
      - ["10.0.23.0/30", ["10.0.35.1", "eth0"]]
      - ["10.0.34.0/30", ["10.0.35.1", "eth0"]]
      - ["10.0.4.0/24", ["10.0.35.1", "eth0"]]
    client:
      - ["0.0.0.0/0", ["10.0.1.1", "eth0"]]
    localdns:
      - ["0.0.0.0/0", ["10.0.1.1", "eth0"]]
    rootdns:
      - ["0.0.0.0/0", ["10.0.4.1", "eth0"]]
    orgdns:
      - ["0.0.0.0/0", ["10.0.4.1", "eth0"]]
    web:
      - ["0.0.0.0/0", ["10.0.5.1", "eth0"]]

  applications:
    dns:
      authoritative:
        ".":
          - 10.0.4.53
        org:
          - 10.0.4.54
      local_ns:
        10.0.1.53:
          - client
      records:
        A:
          kathara.org:
            - 10.0.5.10

  reachability:
    client:
      - kathara.org

  custom_commands:
    r1:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r2:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r3:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r4:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
    r5:
      - command: cat /proc/sys/net/ipv4/ip_forward
        regex_match: '^1\s*$'
