lab_inline: |
  r1[0]="lan1"
  r1[1]="r1_r2"
  r2[0]="r1_r2"
  r2[1]="r2_r3"
  r2[2]="lan2"
  r3[0]="r2_r3"
  r3[1]="lan3"
  pc1[0]="lan1"
  pc2[0]="lan1"
  pc3[0]="lan1"
  pc4[0]="lan2"
  pc5[0]="lan2"
  pc6[0]="lan2"
  pc7[0]="lan3"
  pc8[0]="lan3"
  pc9[0]="lan3"
convergence_time: 10
default_image: kathara/core
test:
  requiring_startup: [r1, r2, r3, pc1, pc2, pc3, pc4, pc5, pc6, pc7, pc8, pc9]
  ip_mapping:
    r1: {"0": 10.10.1.1/24, "1": 10.255.12.1/30}
    r2: {"0": 10.255.12.2/30, "1": 10.255.23.1/30, "2": 10.10.2.1/24}
    r3: {"0": 10.255.23.2/30, "1": 10.10.3.1/24}
    pc1: {"0": 10.10.1.11/24}
    pc2: {"0": 10.10.1.12/24}
    pc3: {"0": 10.10.1.13/24}
    pc4: {"0": 10.10.2.11/24}
    pc5: {"0": 10.10.2.12/24}
    pc6: {"0": 10.10.2.13/24}
    pc7: {"0": 10.10.3.11/24}
    pc8: {"0": 10.10.3.12/24}
    pc9: {"0": 10.10.3.13/24}
  kernel_routes:
    r1: [["0.0.0.0/0", ["10.255.12.2"]]]
    r2:
      - ["10.10.1.0/24", ["10.255.12.1"]]
      - ["10.10.3.0/24", ["10.255.23.2"]]
    r3: [["0.0.0.0/0", ["10.255.23.1"]]]
    pc1: [["0.0.0.0/0", ["10.10.1.1"]]]
    pc2: [["0.0.0.0/0", ["10.10.1.1"]]]
    pc3: [["0.0.0.0/0", ["10.10.1.1"]]]
    pc4: [["0.0.0.0/0", ["10.10.2.1"]]]
    pc5: [["0.0.0.0/0", ["10.10.2.1"]]]
    pc6: [["0.0.0.0/0", ["10.10.2.1"]]]
    pc7: [["0.0.0.0/0", ["10.10.3.1"]]]
    pc8: [["0.0.0.0/0", ["10.10.3.1"]]]
    pc9: [["0.0.0.0/0", ["10.10.3.1"]]]
  reachability:
    pc1: [10.10.1.12, 10.10.1.13, 10.10.2.11, 10.10.2.12, 10.10.2.13, 10.10.3.11, 10.10.3.12, 10.10.3.13]
    pc2: [10.10.1.11, 10.10.1.13, 10.10.2.11, 10.10.2.12, 10.10.2.13, 10.10.3.11, 10.10.3.12, 10.10.3.13]
    pc3: [10.10.1.11, 10.10.1.12, 10.10.2.11, 10.10.2.12, 10.10.2.13, 10.10.3.11, 10.10.3.12, 10.10.3.13]
    pc4: [10.10.1.11, 10.10.1.12, 10.10.1.13, 10.10.2.12, 10.10.2.13, 10.10.3.11, 10.10.3.12, 10.10.3.13]
    pc5: [10.10.1.11, 10.10.1.12, 10.10.1.13, 10.10.2.11, 10.10.2.13, 10.10.3.11, 10.10.3.12, 10.10.3.13]
    pc6: [10.10.1.11, 10.10.1.12, 10.10.1.13, 10.10.2.11, 10.10.2.12, 10.10.3.11, 10.10.3.12, 10.10.3.13]
    pc7: [10.10.1.11, 10.10.1.12, 10.10.1.13, 10.10.2.11, 10.10.2.12, 10.10.2.13, 10.10.3.12, 10.10.3.13]
    pc8: [10.10.1.11, 10.10.1.12, 10.10.1.13, 10.10.2.11, 10.10.2.12, 10.10.2.13, 10.10.3.11, 10.10.3.13]
    pc9: [10.10.1.11, 10.10.1.12, 10.10.1.13, 10.10.2.11, 10.10.2.12, 10.10.2.13, 10.10.3.11, 10.10.3.12]
  custom_commands:
    r1:
      - {command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:1::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq '2001:db8:10:12::1/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fqx 'default via 2001:db8:10:12::2 dev eth1'", exit_code: 0}
    r2:
      - {command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:12::2/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq '2001:db8:10:23::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth2 | grep -Fq '2001:db8:10:2::1/64'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:10:1::/64 | grep -Fq 'via 2001:db8:10:12::1'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:10:3::/64 | grep -Fq 'via 2001:db8:10:23::2'", exit_code: 0}
    r3:
      - {command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:23::2/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq '2001:db8:10:3::1/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fqx 'default via 2001:db8:10:23::1 dev eth0'", exit_code: 0}
    pc1: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:1::11/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:1::1'", exit_code: 0}]
    pc2: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:1::12/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:1::1'", exit_code: 0}]
    pc3: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:1::13/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:1::1'", exit_code: 0}]
    pc4: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:2::11/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:2::1'", exit_code: 0}]
    pc5: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:2::12/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:2::1'", exit_code: 0}]
    pc6: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:2::13/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:2::1'", exit_code: 0}]
    pc7: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:3::11/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:3::1'", exit_code: 0}]
    pc8: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:3::12/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:3::1'", exit_code: 0}]
    pc9: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10:3::13/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10:3::1'", exit_code: 0}]
