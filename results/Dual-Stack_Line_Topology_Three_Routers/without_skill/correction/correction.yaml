lab_inline: |
  r1[0]="lan1"
  r1[1]="r1-r2"
  r2[0]="lan2"
  r2[1]="r1-r2"
  r2[2]="r2-r3"
  r3[0]="lan3"
  r3[1]="r2-r3"
  pc1[0]="lan1"
  pc2[0]="lan1"
  pc3[0]="lan1"
  pc4[0]="lan2"
  pc5[0]="lan2"
  pc6[0]="lan2"
  pc7[0]="lan3"
  pc8[0]="lan3"
  pc9[0]="lan3"
convergence_time: 10
default_image: kathara/base
test:
  requiring_startup: [r1, r2, r3, pc1, pc2, pc3, pc4, pc5, pc6, pc7, pc8, pc9]
  ip_mapping:
    r1: {"0": 192.168.10.1/24, "1": 10.0.12.1/30}
    r2: {"0": 192.168.20.1/24, "1": 10.0.12.2/30, "2": 10.0.23.1/30}
    r3: {"0": 192.168.30.1/24, "1": 10.0.23.2/30}
    pc1: {"0": 192.168.10.11/24}
    pc2: {"0": 192.168.10.12/24}
    pc3: {"0": 192.168.10.13/24}
    pc4: {"0": 192.168.20.11/24}
    pc5: {"0": 192.168.20.12/24}
    pc6: {"0": 192.168.20.13/24}
    pc7: {"0": 192.168.30.11/24}
    pc8: {"0": 192.168.30.12/24}
    pc9: {"0": 192.168.30.13/24}
  kernel_routes:
    r1:
      - ["192.168.20.0/24", ["10.0.12.2"]]
      - ["192.168.30.0/24", ["10.0.12.2"]]
      - ["0.0.0.0/0", ["10.0.12.2"]]
    r2:
      - ["192.168.10.0/24", ["10.0.12.1"]]
      - ["192.168.30.0/24", ["10.0.23.2"]]
    r3:
      - ["192.168.10.0/24", ["10.0.23.1"]]
      - ["192.168.20.0/24", ["10.0.23.1"]]
      - ["0.0.0.0/0", ["10.0.23.1"]]
    pc1: [["0.0.0.0/0", ["192.168.10.1"]]]
    pc2: [["0.0.0.0/0", ["192.168.10.1"]]]
    pc3: [["0.0.0.0/0", ["192.168.10.1"]]]
    pc4: [["0.0.0.0/0", ["192.168.20.1"]]]
    pc5: [["0.0.0.0/0", ["192.168.20.1"]]]
    pc6: [["0.0.0.0/0", ["192.168.20.1"]]]
    pc7: [["0.0.0.0/0", ["192.168.30.1"]]]
    pc8: [["0.0.0.0/0", ["192.168.30.1"]]]
    pc9: [["0.0.0.0/0", ["192.168.30.1"]]]
  reachability:
    pc1: [192.168.10.12, 192.168.10.13, 192.168.20.11, 192.168.20.12, 192.168.20.13, 192.168.30.11, 192.168.30.12, 192.168.30.13]
    pc2: [192.168.10.11, 192.168.10.13, 192.168.20.11, 192.168.20.12, 192.168.20.13, 192.168.30.11, 192.168.30.12, 192.168.30.13]
    pc3: [192.168.10.11, 192.168.10.12, 192.168.20.11, 192.168.20.12, 192.168.20.13, 192.168.30.11, 192.168.30.12, 192.168.30.13]
    pc4: [192.168.10.11, 192.168.10.12, 192.168.10.13, 192.168.20.12, 192.168.20.13, 192.168.30.11, 192.168.30.12, 192.168.30.13]
    pc5: [192.168.10.11, 192.168.10.12, 192.168.10.13, 192.168.20.11, 192.168.20.13, 192.168.30.11, 192.168.30.12, 192.168.30.13]
    pc6: [192.168.10.11, 192.168.10.12, 192.168.10.13, 192.168.20.11, 192.168.20.12, 192.168.30.11, 192.168.30.12, 192.168.30.13]
    pc7: [192.168.10.11, 192.168.10.12, 192.168.10.13, 192.168.20.11, 192.168.20.12, 192.168.20.13, 192.168.30.12, 192.168.30.13]
    pc8: [192.168.10.11, 192.168.10.12, 192.168.10.13, 192.168.20.11, 192.168.20.12, 192.168.20.13, 192.168.30.11, 192.168.30.13]
    pc9: [192.168.10.11, 192.168.10.12, 192.168.10.13, 192.168.20.11, 192.168.20.12, 192.168.20.13, 192.168.30.11, 192.168.30.12]
  custom_commands:
    r1:
      - {command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq '2001:db8:12::1/64'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:20::/64 | grep -Fq 'via 2001:db8:12::2'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:30::/64 | grep -Fq 'via 2001:db8:12::2'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via 2001:db8:12::2'", exit_code: 0}
    r2:
      - {command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:20::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq '2001:db8:12::2/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth2 | grep -Fq '2001:db8:23::1/64'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:10::/64 | grep -Fq 'via 2001:db8:12::1'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:30::/64 | grep -Fq 'via 2001:db8:23::2'", exit_code: 0}
    r3:
      - {command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:30::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq '2001:db8:23::2/64'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:10::/64 | grep -Fq 'via 2001:db8:23::1'", exit_code: 0}
      - {command: "ip -6 route show 2001:db8:20::/64 | grep -Fq 'via 2001:db8:23::1'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via 2001:db8:23::1'", exit_code: 0}
    pc1: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10::11/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10::1'", exit_code: 0}]
    pc2: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10::12/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10::1'", exit_code: 0}]
    pc3: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:10::13/64' && ip -6 route show default | grep -Fq 'via 2001:db8:10::1'", exit_code: 0}]
    pc4: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:20::11/64' && ip -6 route show default | grep -Fq 'via 2001:db8:20::1'", exit_code: 0}]
    pc5: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:20::12/64' && ip -6 route show default | grep -Fq 'via 2001:db8:20::1'", exit_code: 0}]
    pc6: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:20::13/64' && ip -6 route show default | grep -Fq 'via 2001:db8:20::1'", exit_code: 0}]
    pc7: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:30::11/64' && ip -6 route show default | grep -Fq 'via 2001:db8:30::1'", exit_code: 0}]
    pc8: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:30::12/64' && ip -6 route show default | grep -Fq 'via 2001:db8:30::1'", exit_code: 0}]
    pc9: [{command: "ip -6 addr show dev eth0 | grep -Fq '2001:db8:30::13/64' && ip -6 route show default | grep -Fq 'via 2001:db8:30::1'", exit_code: 0}]
