lab_inline: |
  R1[0]="r1-r2"
  R1[1]="r1-r3"
  R1[2]="lan-r1"
  R2[0]="r1-r2"
  R2[1]="r2-r3"
  R2[2]="lan-r2"
  R3[0]="r1-r3"
  R3[1]="r2-r3"
  R3[2]="lan-r3"
  CLIENT[0]="lan-r1"
  DNS[0]="lan-r1"
  WEB[0]="lan-r2"
  PC31[0]="lan-r3"
  PC32[0]="lan-r3"
convergence_time: 10
default_image: kathara/base
test:
  requiring_startup: [R1, R2, R3, CLIENT, DNS, WEB, PC31, PC32]
  ip_mapping:
    R1: {eth0: 10.12.0.1/30, eth1: 10.13.0.1/30, eth2: 192.168.1.1/24}
    R2: {eth0: 10.12.0.2/30, eth1: 10.23.0.1/30, eth2: 192.168.2.1/24}
    R3: {eth0: 10.13.0.2/30, eth1: 10.23.0.2/30, eth2: 192.168.3.1/24}
    CLIENT: {eth0: 192.168.1.10/24}
    DNS: {eth0: 192.168.1.53/24}
    WEB: {eth0: 192.168.2.80/24}
    PC31: {eth0: 192.168.3.31/24}
    PC32: {eth0: 192.168.3.32/24}
  daemons:
    DNS: [named]
    WEB: [apache2]
  kernel_routes:
    R1:
      - [192.168.2.0/24, [10.12.0.2]]
      - [192.168.3.0/24, [10.13.0.2]]
    R2:
      - [192.168.1.0/24, [10.12.0.1]]
      - [192.168.3.0/24, [10.23.0.2]]
    R3:
      - [192.168.1.0/24, [10.13.0.1]]
      - [192.168.2.0/24, [10.23.0.1]]
    CLIENT: [0.0.0.0/0]
    DNS: [0.0.0.0/0]
    WEB: [0.0.0.0/0]
    PC31: [0.0.0.0/0]
    PC32: [0.0.0.0/0]
  applications:
    dns:
      authoritative:
        company.test: [192.168.1.53]
      local_ns:
        192.168.1.53: [CLIENT]
        2001:db8:1::53: [CLIENT]
      records:
        A:
          company.test: [192.168.2.80]
        AAAA:
          company.test: [2001:db8:2::80]
    http:
      CLIENT:
        - url: http://company.test/
          status_code: 200
  reachability:
    CLIENT: [company.test, 192.168.2.80]
  custom_commands:
    R1:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:12::1/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth1", regex_match: "(?m)^\\s*inet6 2001:db8:13::1/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth2", regex_match: "(?m)^\\s*inet6 2001:db8:1::1/64\\s+scope global"}
      - {command: "ip -6 route show 2001:db8:2::/64", regex_match: "^2001:db8:2::/64 via 2001:db8:12::2 dev eth0\\b"}
      - {command: "ip -6 route show 2001:db8:3::/64", regex_match: "^2001:db8:3::/64 via 2001:db8:13::2 dev eth1\\b"}
    R2:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:12::2/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth1", regex_match: "(?m)^\\s*inet6 2001:db8:23::1/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth2", regex_match: "(?m)^\\s*inet6 2001:db8:2::1/64\\s+scope global"}
      - {command: "ip -6 route show 2001:db8:1::/64", regex_match: "^2001:db8:1::/64 via 2001:db8:12::1 dev eth0\\b"}
      - {command: "ip -6 route show 2001:db8:3::/64", regex_match: "^2001:db8:3::/64 via 2001:db8:23::2 dev eth1\\b"}
    R3:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:13::2/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth1", regex_match: "(?m)^\\s*inet6 2001:db8:23::2/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth2", regex_match: "(?m)^\\s*inet6 2001:db8:3::1/64\\s+scope global"}
      - {command: "ip -6 route show 2001:db8:1::/64", regex_match: "^2001:db8:1::/64 via 2001:db8:13::1 dev eth0\\b"}
      - {command: "ip -6 route show 2001:db8:2::/64", regex_match: "^2001:db8:2::/64 via 2001:db8:23::1 dev eth1\\b"}
    CLIENT:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:1::10/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:1::1 dev eth0\\b"}
      - {command: "curl -4 -fsS http://company.test/", exit_code: 0}
      - {command: "curl -6 -fsS http://company.test/", exit_code: 0}
    DNS:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:1::53/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:1::1 dev eth0\\b"}
    WEB:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:2::80/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:2::1 dev eth0\\b"}
    PC31:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:3::31/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:3::1 dev eth0\\b"}
    PC32:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:3::32/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:3::1 dev eth0\\b"}
