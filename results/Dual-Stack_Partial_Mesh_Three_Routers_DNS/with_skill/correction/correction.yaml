lab_inline: |
  r1[0]="r1_r2"
  r1[1]="r1_r3"
  r1[2]="lan_r1"
  r2[0]="r1_r2"
  r2[1]="r2_r3"
  r2[2]="lan_r2"
  r3[0]="r1_r3"
  r3[1]="r2_r3"
  r3[2]="lan_r3"
  client[0]="lan_r1"
  dns[0]="lan_r1"
  web[0]="lan_r2"
  pc1[0]="lan_r3"
  pc2[0]="lan_r3"
convergence_time: 10
default_image: kathara/core
test:
  requiring_startup:
    - r1
    - r2
    - r3
    - client
    - dns
    - web
    - pc1
    - pc2
  ip_mapping:
    r1: {eth0: 10.0.12.1/30, eth1: 10.0.13.1/30, eth2: 192.168.10.1/24}
    r2: {eth0: 10.0.12.2/30, eth1: 10.0.23.1/30, eth2: 192.168.20.1/24}
    r3: {eth0: 10.0.13.2/30, eth1: 10.0.23.2/30, eth2: 192.168.30.1/24}
    client: {eth0: 192.168.10.10/24}
    dns: {eth0: 192.168.10.53/24}
    web: {eth0: 192.168.20.80/24}
    pc1: {eth0: 192.168.30.10/24}
    pc2: {eth0: 192.168.30.11/24}
  daemons:
    dns: [named]
    web: [apache2]
  kernel_routes:
    r1:
      - [192.168.20.0/24, [10.0.12.2]]
      - [192.168.30.0/24, [10.0.13.2]]
    r2:
      - [192.168.10.0/24, [10.0.12.1]]
      - [192.168.30.0/24, [10.0.23.2]]
    r3:
      - [192.168.10.0/24, [10.0.13.1]]
      - [192.168.20.0/24, [10.0.23.1]]
    client: [0.0.0.0/0]
    dns: [0.0.0.0/0]
    web: [0.0.0.0/0]
    pc1: [0.0.0.0/0]
    pc2: [0.0.0.0/0]
  applications:
    dns:
      authoritative:
        company.test: [192.168.10.53]
      local_ns:
        192.168.10.53: [client]
        2001:db8:10::53: [client]
      records:
        A:
          company.test: [192.168.20.80]
        AAAA:
          company.test: [2001:db8:20::80]
    http:
      client:
        - url: http://company.test/
          status_code: 200
  reachability:
    client: [company.test, 192.168.20.80]
  custom_commands:
    r1:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:12::1/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth1", regex_match: "(?m)^\\s*inet6 2001:db8:13::1/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth2", regex_match: "(?m)^\\s*inet6 2001:db8:10::1/64\\s+scope global"}
      - {command: "ip -6 route show 2001:db8:20::/64", regex_match: "^2001:db8:20::/64 via 2001:db8:12::2 dev eth0\\b"}
      - {command: "ip -6 route show 2001:db8:30::/64", regex_match: "^2001:db8:30::/64 via 2001:db8:13::2 dev eth1\\b"}
    r2:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:12::2/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth1", regex_match: "(?m)^\\s*inet6 2001:db8:23::1/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth2", regex_match: "(?m)^\\s*inet6 2001:db8:20::1/64\\s+scope global"}
      - {command: "ip -6 route show 2001:db8:10::/64", regex_match: "^2001:db8:10::/64 via 2001:db8:12::1 dev eth0\\b"}
      - {command: "ip -6 route show 2001:db8:30::/64", regex_match: "^2001:db8:30::/64 via 2001:db8:23::2 dev eth1\\b"}
    r3:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:13::2/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth1", regex_match: "(?m)^\\s*inet6 2001:db8:23::2/64\\s+scope global"}
      - {command: "ip -6 addr show dev eth2", regex_match: "(?m)^\\s*inet6 2001:db8:30::1/64\\s+scope global"}
      - {command: "ip -6 route show 2001:db8:10::/64", regex_match: "^2001:db8:10::/64 via 2001:db8:13::1 dev eth0\\b"}
      - {command: "ip -6 route show 2001:db8:20::/64", regex_match: "^2001:db8:20::/64 via 2001:db8:23::1 dev eth1\\b"}
    client:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:10::10/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:10::1 dev eth0\\b"}
      - {command: "curl -4 -fsS http://company.test/", exit_code: 0}
      - {command: "curl -6 -fsS http://company.test/", exit_code: 0}
    dns:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:10::53/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:10::1 dev eth0\\b"}
    web:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:20::80/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:20::1 dev eth0\\b"}
    pc1:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:30::10/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:30::1 dev eth0\\b"}
    pc2:
      - {command: "ip -6 addr show dev eth0", regex_match: "(?m)^\\s*inet6 2001:db8:30::11/64\\s+scope global"}
      - {command: "ip -6 route show default", regex_match: "^default via 2001:db8:30::1 dev eth0\\b"}
