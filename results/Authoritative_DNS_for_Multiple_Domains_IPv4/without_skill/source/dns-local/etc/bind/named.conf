options {
    directory "/var/cache/bind";
    listen-on { 127.0.0.1; 192.168.10.53; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 192.168.10.0/24; };
    allow-query { 192.168.10.0/24; };
    forward only;
};

zone "university.edu" {
    type forward;
    forward only;
    forwarders { 192.168.20.53; };
};

zone "company.test" {
    type forward;
    forward only;
    forwarders { 192.168.30.53; };
};
