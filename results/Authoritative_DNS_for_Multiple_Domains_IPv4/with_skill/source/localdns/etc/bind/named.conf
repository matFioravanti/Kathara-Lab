options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { any; };
    dnssec-validation no;
};

zone "university.edu" {
    type forward;
    forward only;
    forwarders { 192.168.20.53; };
};

zone "company.test" {
    type forward;
    forward only;
    forwarders { 192.168.30.53; };
};
