lab_inline: |
  R1[0]="r1-r2"
  R1[1]="r1-r3"
  R1[2]="lan-r1"
  R2[0]="r1-r2"
  R2[1]="r2-r4"
  R2[2]="lan-r2"
  R3[0]="r1-r3"
  R3[1]="r3-r4"
  R3[2]="r3-r5"
  R3[3]="lan-r3"
  R4[0]="r2-r4"
  R4[1]="r3-r4"
  R4[2]="r4-r6"
  R4[3]="lan-r4"
  R5[0]="r3-r5"
  R5[1]="r5-r6"
  R5[2]="lan-r5"
  R6[0]="r4-r6"
  R6[1]="r5-r6"
  R6[2]="lan-r6"
  client[0]="lan-r1"
  dns-local[0]="lan-r1"
  dns-root[0]="lan-r3"
  dns-auth[0]="lan-r4"
  web[0]="lan-r4"
  pc-r2a[0]="lan-r2"
  pc-r2b[0]="lan-r2"
  pc-r5a[0]="lan-r5"
  pc-r5b[0]="lan-r5"
  pc-r6a[0]="lan-r6"
  pc-r6b[0]="lan-r6"

convergence_time: 10
default_image: kathara/core

test:
  requiring_startup: [R1, R2, R3, R4, R5, R6, client, dns-local, dns-root, dns-auth, web, pc-r2a, pc-r2b, pc-r5a, pc-r5b, pc-r6a, pc-r6b]
  ip_mapping:
    R1: {"0": 10.0.12.1/30, "1": 10.0.13.1/30, "2": 192.168.1.1/24}
    R2: {"0": 10.0.12.2/30, "1": 10.0.24.1/30, "2": 192.168.2.1/24}
    R3: {"0": 10.0.13.2/30, "1": 10.0.34.1/30, "2": 10.0.35.1/30, "3": 192.168.3.1/24}
    R4: {"0": 10.0.24.2/30, "1": 10.0.34.2/30, "2": 10.0.46.1/30, "3": 192.168.4.1/24}
    R5: {"0": 10.0.35.2/30, "1": 10.0.56.1/30, "2": 192.168.5.1/24}
    R6: {"0": 10.0.46.2/30, "1": 10.0.56.2/30, "2": 192.168.6.1/24}
    client: {"0": 192.168.1.10/24}
    dns-local: {"0": 192.168.1.53/24}
    dns-root: {"0": 192.168.3.53/24}
    dns-auth: {"0": 192.168.4.53/24}
    web: {"0": 192.168.4.80/24}
    pc-r2a: {"0": 192.168.2.10/24}
    pc-r2b: {"0": 192.168.2.11/24}
    pc-r5a: {"0": 192.168.5.10/24}
    pc-r5b: {"0": 192.168.5.11/24}
    pc-r6a: {"0": 192.168.6.10/24}
    pc-r6b: {"0": 192.168.6.11/24}
  kernel_routes:
    R1: [[192.168.2.0/24, [10.0.12.2]], [192.168.3.0/24, [10.0.13.2]], [192.168.4.0/24, [10.0.13.2]], [192.168.5.0/24, [10.0.13.2]], [192.168.6.0/24, [10.0.13.2]]]
    R2: [[192.168.1.0/24, [10.0.12.1]], [192.168.3.0/24, [10.0.24.2]], [192.168.4.0/24, [10.0.24.2]], [192.168.5.0/24, [10.0.24.2]], [192.168.6.0/24, [10.0.24.2]]]
    R3: [[192.168.1.0/24, [10.0.13.1]], [192.168.2.0/24, [10.0.34.2]], [192.168.4.0/24, [10.0.34.2]], [192.168.5.0/24, [10.0.35.2]], [192.168.6.0/24, [10.0.35.2]]]
    R4: [[192.168.1.0/24, [10.0.34.1]], [192.168.2.0/24, [10.0.24.1]], [192.168.3.0/24, [10.0.34.1]], [192.168.5.0/24, [10.0.34.1]], [192.168.6.0/24, [10.0.46.2]]]
    R5: [[192.168.1.0/24, [10.0.35.1]], [192.168.2.0/24, [10.0.56.2]], [192.168.3.0/24, [10.0.35.1]], [192.168.4.0/24, [10.0.56.2]], [192.168.6.0/24, [10.0.56.2]]]
    R6: [[192.168.1.0/24, [10.0.56.1]], [192.168.2.0/24, [10.0.46.1]], [192.168.3.0/24, [10.0.56.1]], [192.168.4.0/24, [10.0.46.1]], [192.168.5.0/24, [10.0.56.1]]]
    client: [[0.0.0.0/0, [192.168.1.1]]]
    dns-local: [[0.0.0.0/0, [192.168.1.1]]]
    dns-root: [[0.0.0.0/0, [192.168.3.1]]]
    dns-auth: [[0.0.0.0/0, [192.168.4.1]]]
    web: [[0.0.0.0/0, [192.168.4.1]]]
    pc-r2a: [[0.0.0.0/0, [192.168.2.1]]]
    pc-r2b: [[0.0.0.0/0, [192.168.2.1]]]
    pc-r5a: [[0.0.0.0/0, [192.168.5.1]]]
    pc-r5b: [[0.0.0.0/0, [192.168.5.1]]]
    pc-r6a: [[0.0.0.0/0, [192.168.6.1]]]
    pc-r6b: [[0.0.0.0/0, [192.168.6.1]]]
  applications:
    dns:
      authoritative:
        ".": [192.168.3.53]
        example.net: [192.168.4.53]
      local_ns:
        192.168.1.53: [client]
      records:
        A:
          example.net: [192.168.4.80]
        AAAA:
          example.net: [2001:db8:4::80]
    http:
      client:
        - url: http://example.net/
          status_code: 200
  custom_commands:
    R1:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:12::1/64 && ip -6 addr show dev eth1 | grep -Fq 2001:db8:13::1/64 && ip -6 addr show dev eth2 | grep -Fq 2001:db8:1::1/64 && ip -6 route show 2001:db8:2::/64 | grep -Fq \"via 2001:db8:12::2\" && ip -6 route show 2001:db8:3::/64 | grep -Fq \"via 2001:db8:13::2\" && ip -6 route show 2001:db8:4::/64 | grep -Fq \"via 2001:db8:13::2\" && ip -6 route show 2001:db8:5::/64 | grep -Fq \"via 2001:db8:13::2\" && ip -6 route show 2001:db8:6::/64 | grep -Fq \"via 2001:db8:13::2\"'"
        exit_code: 0
    R2:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:12::2/64 && ip -6 addr show dev eth1 | grep -Fq 2001:db8:24::1/64 && ip -6 addr show dev eth2 | grep -Fq 2001:db8:2::1/64 && ip -6 route show 2001:db8:1::/64 | grep -Fq \"via 2001:db8:12::1\" && ip -6 route show 2001:db8:3::/64 | grep -Fq \"via 2001:db8:24::2\" && ip -6 route show 2001:db8:4::/64 | grep -Fq \"via 2001:db8:24::2\" && ip -6 route show 2001:db8:5::/64 | grep -Fq \"via 2001:db8:24::2\" && ip -6 route show 2001:db8:6::/64 | grep -Fq \"via 2001:db8:24::2\"'"
        exit_code: 0
    R3:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:13::2/64 && ip -6 addr show dev eth1 | grep -Fq 2001:db8:34::1/64 && ip -6 addr show dev eth2 | grep -Fq 2001:db8:35::1/64 && ip -6 addr show dev eth3 | grep -Fq 2001:db8:3::1/64 && ip -6 route show 2001:db8:1::/64 | grep -Fq \"via 2001:db8:13::1\" && ip -6 route show 2001:db8:2::/64 | grep -Fq \"via 2001:db8:34::2\" && ip -6 route show 2001:db8:4::/64 | grep -Fq \"via 2001:db8:34::2\" && ip -6 route show 2001:db8:5::/64 | grep -Fq \"via 2001:db8:35::2\" && ip -6 route show 2001:db8:6::/64 | grep -Fq \"via 2001:db8:35::2\"'"
        exit_code: 0
    R4:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:24::2/64 && ip -6 addr show dev eth1 | grep -Fq 2001:db8:34::2/64 && ip -6 addr show dev eth2 | grep -Fq 2001:db8:46::1/64 && ip -6 addr show dev eth3 | grep -Fq 2001:db8:4::1/64 && ip -6 route show 2001:db8:1::/64 | grep -Fq \"via 2001:db8:34::1\" && ip -6 route show 2001:db8:2::/64 | grep -Fq \"via 2001:db8:24::1\" && ip -6 route show 2001:db8:3::/64 | grep -Fq \"via 2001:db8:34::1\" && ip -6 route show 2001:db8:5::/64 | grep -Fq \"via 2001:db8:34::1\" && ip -6 route show 2001:db8:6::/64 | grep -Fq \"via 2001:db8:46::2\"'"
        exit_code: 0
    R5:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:35::2/64 && ip -6 addr show dev eth1 | grep -Fq 2001:db8:56::1/64 && ip -6 addr show dev eth2 | grep -Fq 2001:db8:5::1/64 && ip -6 route show 2001:db8:1::/64 | grep -Fq \"via 2001:db8:35::1\" && ip -6 route show 2001:db8:2::/64 | grep -Fq \"via 2001:db8:56::2\" && ip -6 route show 2001:db8:3::/64 | grep -Fq \"via 2001:db8:35::1\" && ip -6 route show 2001:db8:4::/64 | grep -Fq \"via 2001:db8:56::2\" && ip -6 route show 2001:db8:6::/64 | grep -Fq \"via 2001:db8:56::2\"'"
        exit_code: 0
    R6:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:46::2/64 && ip -6 addr show dev eth1 | grep -Fq 2001:db8:56::2/64 && ip -6 addr show dev eth2 | grep -Fq 2001:db8:6::1/64 && ip -6 route show 2001:db8:1::/64 | grep -Fq \"via 2001:db8:56::1\" && ip -6 route show 2001:db8:2::/64 | grep -Fq \"via 2001:db8:46::1\" && ip -6 route show 2001:db8:3::/64 | grep -Fq \"via 2001:db8:56::1\" && ip -6 route show 2001:db8:4::/64 | grep -Fq \"via 2001:db8:46::1\" && ip -6 route show 2001:db8:5::/64 | grep -Fq \"via 2001:db8:56::1\"'"
        exit_code: 0
    client:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:1::10/64 && ip -6 route show default | grep -Fq \"via 2001:db8:1::1\" && dig +short AAAA example.net | grep -Fxq 2001:db8:4::80 && curl -4 -fsS http://example.net/ >/dev/null && curl -6 -fsS http://example.net/ >/dev/null'"
        exit_code: 0
    dns-local:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:1::53/64 && ip -6 route show default | grep -Fq \"via 2001:db8:1::1\" && dig +short AAAA example.net @2001:db8:1::53 | grep -Fxq 2001:db8:4::80'"
        exit_code: 0
    dns-root:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:3::53/64 && ip -6 route show default | grep -Fq \"via 2001:db8:3::1\"'"
        exit_code: 0
    dns-auth:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:4::53/64 && ip -6 route show default | grep -Fq \"via 2001:db8:4::1\"'"
        exit_code: 0
    web:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:4::80/64 && ip -6 route show default | grep -Fq \"via 2001:db8:4::1\"'"
        exit_code: 0
    pc-r2a:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:2::10/64 && ip -6 route show default | grep -Fq \"via 2001:db8:2::1\"'"
        exit_code: 0
    pc-r2b:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:2::11/64 && ip -6 route show default | grep -Fq \"via 2001:db8:2::1\"'"
        exit_code: 0
    pc-r5a:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:5::10/64 && ip -6 route show default | grep -Fq \"via 2001:db8:5::1\"'"
        exit_code: 0
    pc-r5b:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:5::11/64 && ip -6 route show default | grep -Fq \"via 2001:db8:5::1\"'"
        exit_code: 0
    pc-r6a:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:6::10/64 && ip -6 route show default | grep -Fq \"via 2001:db8:6::1\"'"
        exit_code: 0
    pc-r6b:
      - command: "sh -c 'ip -6 addr show dev eth0 | grep -Fq 2001:db8:6::11/64 && ip -6 route show default | grep -Fq \"via 2001:db8:6::1\"'"
        exit_code: 0
