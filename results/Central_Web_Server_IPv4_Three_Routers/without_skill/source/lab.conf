# IPv4 static-routing laboratory: clients -> R1 -> R2 -> R3 -> web server

r1[image]="kathara/base"
r1[0]="left_lan"
r1[1]="r1_r2"
r1[/r1.startup]="r1.startup"
r1[exec]="bash /r1.startup"

r2[image]="kathara/base"
r2[0]="r1_r2"
r2[1]="r2_r3"
r2[/r2.startup]="r2.startup"
r2[exec]="bash /r2.startup"

r3[image]="kathara/base"
r3[0]="r2_r3"
r3[1]="server_lan"
r3[/r3.startup]="r3.startup"
r3[exec]="bash /r3.startup"

client1[image]="kathara/base"
client1[0]="left_lan"
client1[/client1.startup]="client1.startup"
client1[exec]="bash /client1.startup"

client2[image]="kathara/base"
client2[0]="left_lan"
client2[/client2.startup]="client2.startup"
client2[exec]="bash /client2.startup"

web[image]="kathara/base"
web[0]="server_lan"
web[/web.startup]="web.startup"
web[exec]="bash /web.startup"
