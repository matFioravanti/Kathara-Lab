lab_inline: |
  r1[0]="left_lan"
  r1[1]="r1_r2"
  r2[0]="r1_r2"
  r2[1]="r2_r3"
  r3[0]="r2_r3"
  r3[1]="server_lan"
  client1[0]="left_lan"
  client2[0]="left_lan"
  web[0]="server_lan"

convergence_time: 10
default_image: kathara/base

test:
  requiring_startup:
    - r1
    - r2
    - r3
    - client1
    - client2
    - web

  ip_mapping:
    r1:
      "0": 192.168.10.1/24
      "1": 10.0.12.1/30
    r2:
      "0": 10.0.12.2/30
      "1": 10.0.23.1/30
    r3:
      "0": 10.0.23.2/30
      "1": 192.168.30.1/24
    client1:
      "0": 192.168.10.11/24
    client2:
      "0": 192.168.10.12/24
    web:
      "0": 192.168.30.10/24

  daemons:
    r1:
      - "!bgpd"
      - "!ospfd"
      - "!ripd"
    r2:
      - "!bgpd"
      - "!ospfd"
      - "!ripd"
    r3:
      - "!bgpd"
      - "!ospfd"
      - "!ripd"

  kernel_routes:
    r1:
      - ["0.0.0.0/0", ["10.0.12.2"]]
    r2:
      - ["192.168.10.0/24", ["10.0.12.1"]]
      - ["192.168.30.0/24", ["10.0.23.2"]]
    r3:
      - ["0.0.0.0/0", ["10.0.23.1"]]
    client1:
      - ["0.0.0.0/0", ["192.168.10.1"]]
    client2:
      - ["0.0.0.0/0", ["192.168.10.1"]]
    web:
      - ["0.0.0.0/0", ["192.168.30.1"]]

  reachability:
    client1:
      - 192.168.30.10
    client2:
      - 192.168.30.10

  applications:
    http:
      web:
        - url: http://192.168.30.10/
          expected_status: 200
