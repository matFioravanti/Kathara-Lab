lab_inline: |
  router-left[0]="clients"
  router-left[1]="left-middle"
  router-middle[0]="left-middle"
  router-middle[1]="middle-right"
  router-right[0]="middle-right"
  router-right[1]="servers"
  client1[0]="clients"
  client2[0]="clients"
  web[0]="servers"

default_image: kathara/base
convergence_time: 10

test:
  requiring_startup:
    - router-left
    - router-middle
    - router-right
    - client1
    - client2
    - web

  ip_mapping:
    router-left:
      "0": 192.168.10.1/24
      "1": 10.0.12.1/30
    router-middle:
      "0": 10.0.12.2/30
      "1": 10.0.23.1/30
    router-right:
      "0": 10.0.23.2/30
      "1": 192.168.30.1/24
    client1:
      "0": 192.168.10.11/24
    client2:
      "0": 192.168.10.12/24
    web:
      "0": 192.168.30.10/24

  daemons:
    router-left:
      - "!ripd"
      - "!ospfd"
      - "!bgpd"
    router-middle:
      - "!ripd"
      - "!ospfd"
      - "!bgpd"
    router-right:
      - "!ripd"
      - "!ospfd"
      - "!bgpd"
    client1:
      - "!ripd"
      - "!ospfd"
      - "!bgpd"
    client2:
      - "!ripd"
      - "!ospfd"
      - "!bgpd"
    web:
      - "!ripd"
      - "!ospfd"
      - "!bgpd"

  kernel_routes:
    router-left:
      - ["192.168.30.0/24", ["10.0.12.2"]]
    router-middle:
      - ["192.168.10.0/24", ["10.0.12.1"]]
      - ["192.168.30.0/24", ["10.0.23.2"]]
    router-right:
      - ["192.168.10.0/24", ["10.0.23.1"]]
    client1:
      - ["0.0.0.0/0", ["192.168.10.1"]]
    client2:
      - ["0.0.0.0/0", ["192.168.10.1"]]
    web:
      - ["0.0.0.0/0", ["192.168.30.1"]]

  reachability:
    client1:
      - 192.168.30.10
    client2:
      - 192.168.30.10

  applications:
    http:
      client1:
        - url: http://192.168.30.10/
          status_code: 200
      client2:
        - url: http://192.168.30.10/
          status_code: 200
