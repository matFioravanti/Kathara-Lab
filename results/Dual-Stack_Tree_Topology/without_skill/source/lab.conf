# Dual-stack three-router tree
#
#                 root
#                /    \
#           child1    child2
#              |         |
#            pc1       pc2
#
# The root router also serves pc-root on its local LAN.

root[0]=root-child1
root[1]=root-child2
root[2]=root-lan
root[image]="kathara/base"

child1[0]=root-child1
child1[1]=child1-lan
child1[image]="kathara/base"

child2[0]=root-child2
child2[1]=child2-lan
child2[image]="kathara/base"

pc-root[0]=root-lan
pc-root[image]="kathara/base"

pc1[0]=child1-lan
pc1[image]="kathara/base"

pc2[0]=child2-lan
pc2[image]="kathara/base"
