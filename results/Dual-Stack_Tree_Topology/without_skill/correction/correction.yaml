lab_inline: |
  root[0]="root-child1"
  root[1]="root-child2"
  root[2]="root-lan"
  child1[0]="root-child1"
  child1[1]="child1-lan"
  child2[0]="root-child2"
  child2[1]="child2-lan"
  pc-root[0]="root-lan"
  pc1[0]="child1-lan"
  pc2[0]="child2-lan"

convergence_time: 10
default_image: kathara/base

test:
  requiring_startup:
    - root
    - child1
    - child2
    - pc-root
    - pc1
    - pc2

  ip_mapping:
    root:
      "0": 10.0.1.1/30
      "1": 10.0.2.1/30
      "2": 192.168.10.1/24
    child1:
      "0": 10.0.1.2/30
      "1": 192.168.20.1/24
    child2:
      "0": 10.0.2.2/30
      "1": 192.168.30.1/24
    pc-root:
      "0": 192.168.10.10/24
    pc1:
      "0": 192.168.20.10/24
    pc2:
      "0": 192.168.30.10/24

  kernel_routes:
    root:
      - ["192.168.20.0/24", ["10.0.1.2"]]
      - ["192.168.30.0/24", ["10.0.2.2"]]
    child1:
      - ["0.0.0.0/0", ["10.0.1.1"]]
    child2:
      - ["0.0.0.0/0", ["10.0.2.1"]]
    pc-root:
      - ["0.0.0.0/0", ["192.168.10.1"]]
    pc1:
      - ["0.0.0.0/0", ["192.168.20.1"]]
    pc2:
      - ["0.0.0.0/0", ["192.168.30.1"]]

  custom_commands:
    root:
      - command: "ip -6 addr show dev eth0 | grep -Fq 'inet6 fd00:1::1/64 scope global'"
        exit_code: 0
      - command: "ip -6 addr show dev eth1 | grep -Fq 'inet6 fd00:2::1/64 scope global'"
        exit_code: 0
      - command: "ip -6 addr show dev eth2 | grep -Fq 'inet6 fd00:10::1/64 scope global'"
        exit_code: 0
      - command: "ip -6 route show fd00:20::/64 | grep -Eq '^fd00:20::/64 via fd00:1::2 dev eth0'"
        exit_code: 0
      - command: "ip -6 route show fd00:30::/64 | grep -Eq '^fd00:30::/64 via fd00:2::2 dev eth1'"
        exit_code: 0
    child1:
      - command: "ip -6 addr show dev eth0 | grep -Fq 'inet6 fd00:1::2/64 scope global'"
        exit_code: 0
      - command: "ip -6 addr show dev eth1 | grep -Fq 'inet6 fd00:20::1/64 scope global'"
        exit_code: 0
      - command: "ip -6 route show default | grep -Eq '^default via fd00:1::1 dev eth0'"
        exit_code: 0
    child2:
      - command: "ip -6 addr show dev eth0 | grep -Fq 'inet6 fd00:2::2/64 scope global'"
        exit_code: 0
      - command: "ip -6 addr show dev eth1 | grep -Fq 'inet6 fd00:30::1/64 scope global'"
        exit_code: 0
      - command: "ip -6 route show default | grep -Eq '^default via fd00:2::1 dev eth0'"
        exit_code: 0
    pc-root:
      - command: "ip -6 addr show dev eth0 | grep -Fq 'inet6 fd00:10::10/64 scope global'"
        exit_code: 0
      - command: "ip -6 route show default | grep -Eq '^default via fd00:10::1 dev eth0'"
        exit_code: 0
    pc1:
      - command: "ip -6 addr show dev eth0 | grep -Fq 'inet6 fd00:20::10/64 scope global'"
        exit_code: 0
      - command: "ip -6 route show default | grep -Eq '^default via fd00:20::1 dev eth0'"
        exit_code: 0
    pc2:
      - command: "ip -6 addr show dev eth0 | grep -Fq 'inet6 fd00:30::10/64 scope global'"
        exit_code: 0
      - command: "ip -6 route show default | grep -Eq '^default via fd00:30::1 dev eth0'"
        exit_code: 0

  reachability:
    pc-root:
      - 192.168.20.10
      - 192.168.30.10
      - fd00:20::10
      - fd00:30::10
    pc1:
      - 192.168.10.10
      - 192.168.30.10
      - fd00:10::10
      - fd00:30::10
    pc2:
      - 192.168.10.10
      - 192.168.20.10
      - fd00:10::10
      - fd00:20::10
