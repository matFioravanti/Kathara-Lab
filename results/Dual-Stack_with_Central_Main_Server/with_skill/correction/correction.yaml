lab_inline: |
  central[0]="p2p_edge1"
  central[1]="p2p_edge2"
  central[2]="p2p_edge3"
  central[3]="central_lan"
  edge1[0]="p2p_edge1"
  edge1[1]="edge1_lan"
  edge2[0]="p2p_edge2"
  edge2[1]="edge2_lan"
  edge3[0]="p2p_edge3"
  edge3[1]="edge3_lan"
  server[0]="central_lan"
  e1c1[0]="edge1_lan"
  e1c2[0]="edge1_lan"
  e2c1[0]="edge2_lan"
  e2c2[0]="edge2_lan"
  e3c1[0]="edge3_lan"
  e3c2[0]="edge3_lan"
convergence_time: 10
default_image: kathara/core
test:
  requiring_startup: [central, edge1, edge2, edge3, server, e1c1, e1c2, e2c1, e2c2, e3c1, e3c2]
  ip_mapping:
    central: {"0": 10.0.1.1/30, "1": 10.0.2.1/30, "2": 10.0.3.1/30, "3": 10.0.10.1/24}
    edge1: {"0": 10.0.1.2/30, "1": 10.0.101.1/24}
    edge2: {"0": 10.0.2.2/30, "1": 10.0.102.1/24}
    edge3: {"0": 10.0.3.2/30, "1": 10.0.103.1/24}
    server: {"0": 10.0.10.10/24}
    e1c1: {"0": 10.0.101.11/24}
    e1c2: {"0": 10.0.101.12/24}
    e2c1: {"0": 10.0.102.11/24}
    e2c2: {"0": 10.0.102.12/24}
    e3c1: {"0": 10.0.103.11/24}
    e3c2: {"0": 10.0.103.12/24}
  kernel_routes:
    central:
      - [10.0.101.0/24, [10.0.1.2]]
      - [10.0.102.0/24, [10.0.2.2]]
      - [10.0.103.0/24, [10.0.3.2]]
    edge1: [[0.0.0.0/0, [10.0.1.1]]]
    edge2: [[0.0.0.0/0, [10.0.2.1]]]
    edge3: [[0.0.0.0/0, [10.0.3.1]]]
    server: [[0.0.0.0/0, [10.0.10.1]]]
    e1c1: [[0.0.0.0/0, [10.0.101.1]]]
    e1c2: [[0.0.0.0/0, [10.0.101.1]]]
    e2c1: [[0.0.0.0/0, [10.0.102.1]]]
    e2c2: [[0.0.0.0/0, [10.0.102.1]]]
    e3c1: [[0.0.0.0/0, [10.0.103.1]]]
    e3c2: [[0.0.0.0/0, [10.0.103.1]]]
  reachability:
    e1c1: [10.0.10.10]
    e1c2: [10.0.10.10]
    e2c1: [10.0.10.10]
    e2c2: [10.0.10.10]
    e3c1: [10.0.10.10]
    e3c2: [10.0.10.10]
  custom_commands:
    central:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:1::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq 'fd00:0:2::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth2 | grep -Fq 'fd00:0:3::1/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth3 | grep -Fq 'fd00:0:10::1/64'", exit_code: 0}
      - {command: "ip -6 route show fd00:0:101::/64 | grep -Fq 'via fd00:0:1::2'", exit_code: 0}
      - {command: "ip -6 route show fd00:0:102::/64 | grep -Fq 'via fd00:0:2::2'", exit_code: 0}
      - {command: "ip -6 route show fd00:0:103::/64 | grep -Fq 'via fd00:0:3::2'", exit_code: 0}
    edge1:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:1::2/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq 'fd00:0:101::1/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:1::1'", exit_code: 0}
    edge2:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:2::2/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq 'fd00:0:102::1/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:2::1'", exit_code: 0}
    edge3:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:3::2/64'", exit_code: 0}
      - {command: "ip -6 addr show dev eth1 | grep -Fq 'fd00:0:103::1/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:3::1'", exit_code: 0}
    server:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:10::10/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:10::1'", exit_code: 0}
    e1c1:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:101::11/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:101::1'", exit_code: 0}
      - {command: "ping -6 -q -n -c 1 fd00:0:10::10", exit_code: 0}
    e1c2:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:101::12/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:101::1'", exit_code: 0}
      - {command: "ping -6 -q -n -c 1 fd00:0:10::10", exit_code: 0}
    e2c1:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:102::11/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:102::1'", exit_code: 0}
      - {command: "ping -6 -q -n -c 1 fd00:0:10::10", exit_code: 0}
    e2c2:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:102::12/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:102::1'", exit_code: 0}
      - {command: "ping -6 -q -n -c 1 fd00:0:10::10", exit_code: 0}
    e3c1:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:103::11/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:103::1'", exit_code: 0}
      - {command: "ping -6 -q -n -c 1 fd00:0:10::10", exit_code: 0}
    e3c2:
      - {command: "ip -6 addr show dev eth0 | grep -Fq 'fd00:0:103::12/64'", exit_code: 0}
      - {command: "ip -6 route show default | grep -Fq 'via fd00:0:103::1'", exit_code: 0}
      - {command: "ping -6 -q -n -c 1 fd00:0:10::10", exit_code: 0}
