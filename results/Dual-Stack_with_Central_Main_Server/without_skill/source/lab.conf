# Dual-stack star topology: r0 is the central router; r1-r3 are edge routers.
r0[0]="p2p_r1"
r1[0]="p2p_r1"

r0[1]="p2p_r2"
r2[0]="p2p_r2"

r0[2]="p2p_r3"
r3[0]="p2p_r3"

r0[3]="central_lan"
main_server[0]="central_lan"

r1[1]="lan_r1"
r1_client1[0]="lan_r1"
r1_client2[0]="lan_r1"

r2[1]="lan_r2"
r2_client1[0]="lan_r2"
r2_client2[0]="lan_r2"

r3[1]="lan_r3"
r3_client1[0]="lan_r3"
r3_client2[0]="lan_r3"

r0[image]="kathara/base"
r1[image]="kathara/base"
r2[image]="kathara/base"
r3[image]="kathara/base"
main_server[image]="kathara/base"
r1_client1[image]="kathara/base"
r1_client2[image]="kathara/base"
r2_client1[image]="kathara/base"
r2_client2[image]="kathara/base"
r3_client1[image]="kathara/base"
r3_client2[image]="kathara/base"

r0[etc/kathara/startup]="r0.startup"
r1[etc/kathara/startup]="r1.startup"
r2[etc/kathara/startup]="r2.startup"
r3[etc/kathara/startup]="r3.startup"
main_server[etc/kathara/startup]="main_server.startup"
r1_client1[etc/kathara/startup]="r1_client1.startup"
r1_client2[etc/kathara/startup]="r1_client2.startup"
r2_client1[etc/kathara/startup]="r2_client1.startup"
r2_client2[etc/kathara/startup]="r2_client2.startup"
r3_client1[etc/kathara/startup]="r3_client1.startup"
r3_client2[etc/kathara/startup]="r3_client2.startup"
