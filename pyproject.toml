[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kathara-pipeline"
version = "0.1.0"
description = "Sequential Codex-based generation and verification pipeline for Kathara labs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "kathara-lab-checker==0.1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
kathara-pipeline = "kathara_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
