[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kathara-experiment-framework"
version = "0.4.1"
description = "Automated paired LLM framework for Kathara lab generation with and without a creation skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "kathara-lab-checker==0.1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
kathara-experiment = "kathara_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
