# Checker configuration for the three-router static-routing lab.
# The lab is static-only, so no routing-protocol convergence delay is required.
lab_inline: |
  r1[0]="LAN1"
  r1[1]="R1_R2"
  r2[0]="LAN2"
  r2[1]="R1_R2"
  r2[2]="R2_R3"
  r3[0]="LAN3"
  r3[1]="R2_R3"
  pc1_1[0]="LAN1"
  pc1_2[0]="LAN1"
  pc1_3[0]="LAN1"
  pc1_4[0]="LAN1"
  pc1_5[0]="LAN1"
  pc2_1[0]="LAN2"
  pc2_2[0]="LAN2"
  pc2_3[0]="LAN2"
  pc2_4[0]="LAN2"
  pc2_5[0]="LAN2"
  pc3_1[0]="LAN3"
  pc3_2[0]="LAN3"
  pc3_3[0]="LAN3"
  pc3_4[0]="LAN3"
  pc3_5[0]="LAN3"

convergence_time: 10
default_image: kathara/core:latest

test:
  requiring_startup:
    - r1
    - r2
    - r3
    - pc1_1
    - pc1_2
    - pc1_3
    - pc1_4
    - pc1_5
    - pc2_1
    - pc2_2
    - pc2_3
    - pc2_4
    - pc2_5
    - pc3_1
    - pc3_2
    - pc3_3
    - pc3_4
    - pc3_5

  ip_mapping:
    r1:
      "0": 10.1.1.1/24
      "1": 10.0.12.1/30
    r2:
      "0": 10.2.2.1/24
      "1": 10.0.12.2/30
      "2": 10.0.23.1/30
    r3:
      "0": 10.3.3.1/24
      "1": 10.0.23.2/30
    pc1_1:
      "0": 10.1.1.11/24
    pc1_2:
      "0": 10.1.1.12/24
    pc1_3:
      "0": 10.1.1.13/24
    pc1_4:
      "0": 10.1.1.14/24
    pc1_5:
      "0": 10.1.1.15/24
    pc2_1:
      "0": 10.2.2.11/24
    pc2_2:
      "0": 10.2.2.12/24
    pc2_3:
      "0": 10.2.2.13/24
    pc2_4:
      "0": 10.2.2.14/24
    pc2_5:
      "0": 10.2.2.15/24
    pc3_1:
      "0": 10.3.3.11/24
    pc3_2:
      "0": 10.3.3.12/24
    pc3_3:
      "0": 10.3.3.13/24
    pc3_4:
      "0": 10.3.3.14/24
    pc3_5:
      "0": 10.3.3.15/24

  daemons:
    r1:
      - "!ripd"
      - "!ospfd"
      - "!isisd"
      - "!bgpd"
    r2:
      - "!ripd"
      - "!ospfd"
      - "!isisd"
      - "!bgpd"
    r3:
      - "!ripd"
      - "!ospfd"
      - "!isisd"
      - "!bgpd"

  # Only manually installed routes are listed; connected routes are excluded.
  kernel_routes:
    r1:
      - ["10.2.2.0/24", ["10.0.12.2"]]
      - ["10.3.3.0/24", ["10.0.12.2"]]
    r2:
      - ["10.1.1.0/24", ["10.0.12.1"]]
      - ["10.3.3.0/24", ["10.0.23.2"]]
    r3:
      - ["10.1.1.0/24", ["10.0.23.1"]]
      - ["10.2.2.0/24", ["10.0.23.1"]]
    pc1_1:
      - ["0.0.0.0/0", ["10.1.1.1"]]
    pc1_2:
      - ["0.0.0.0/0", ["10.1.1.1"]]
    pc1_3:
      - ["0.0.0.0/0", ["10.1.1.1"]]
    pc1_4:
      - ["0.0.0.0/0", ["10.1.1.1"]]
    pc1_5:
      - ["0.0.0.0/0", ["10.1.1.1"]]
    pc2_1:
      - ["0.0.0.0/0", ["10.2.2.1"]]
    pc2_2:
      - ["0.0.0.0/0", ["10.2.2.1"]]
    pc2_3:
      - ["0.0.0.0/0", ["10.2.2.1"]]
    pc2_4:
      - ["0.0.0.0/0", ["10.2.2.1"]]
    pc2_5:
      - ["0.0.0.0/0", ["10.2.2.1"]]
    pc3_1:
      - ["0.0.0.0/0", ["10.3.3.1"]]
    pc3_2:
      - ["0.0.0.0/0", ["10.3.3.1"]]
    pc3_3:
      - ["0.0.0.0/0", ["10.3.3.1"]]
    pc3_4:
      - ["0.0.0.0/0", ["10.3.3.1"]]
    pc3_5:
      - ["0.0.0.0/0", ["10.3.3.1"]]

